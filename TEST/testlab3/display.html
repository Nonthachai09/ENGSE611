<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block-example div {
            display: block;
            padding: 10px;
            margin-bottom: 5px;
            background: #c8e6ff;
        }

        .inline-example span {
            display: inline;
            padding: 5px;
            background: #ffc8c8;
            margin-right: 5px;
        }

        .inline-block-example div {
            display: inline-block;
            width: 120px;
            height: 40px;
            background: #d2ffd2;
            margin-right: 10px;
            text-align: center;
            line-height: 40px;
            border: 1px solid #4caf50;
        }
    </style>
</head>

<body>
    <h3>Block</h3>
    <div class="block-example">
        <div>Block 1</div>
        <div>Block 2</div>
    </div>

    <h3>Inline</h3>
    <div class="inline-example">
        <span>Inline 1</span>
        <span>Inline 2 Inline 2</span>
        <span>Inline 3</span>
    </div>

    <h3>Inline-block</h3>
    <div class="inline-block-example">
        <div>Box A</div>
        <div>Box B Box B</div>
        <div>Box C</div>
    </div>

</body>

</html>
