<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Grade Switch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .card {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            margin: auto;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 8px 15px;
            background: #2c5364;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #203a43;
        }

        #outputBox {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>การตรวจสอบเกรด (Switch Statement)</h2>

    <div class="card">
        <input type="number" id="scoreInput" placeholder="กรอกคะแนน (0-100)">
        <br>
        <button onclick="checkGrade()">ตรวจสอบ</button>

        <div id="outputBox"></div>
    </div>

    <script>
        function checkGrade() {
            let score = Number(document.getElementById("scoreInput").value);

            if (score < 0 || score > 100 || isNaN(score)) {
                alert("กรุณากรอกคะแนนระหว่าง 0 - 100");
                return;
            }

            let grade;

            if (score >= 80) {
                grade = "A";
            } else if (score >= 70) {
                grade = "B";
            } else if (score >= 60) {
                grade = "C";
            } else if (score >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            let description;

            switch (grade) {
                case "A":
                    description = "ยอดเยี่ยมมาก";
                    break;
                case "B":
                    description = "ดีมาก รักษามาตรฐานไว้";
                    break;
                case "C":
                    description = "ผ่านเกณฑ์ระดับดี";
                    break;
                case "D":
                    description = "พอใช้ แต่ควรพัฒนาเพิ่ม";
                    break;
                case "F":
                    description = "ต้องอ่านหนังสือเพิ่ม";
                    break;
                default:
                    description = "ไม่พบข้อมูล";
            }

            let result = (score >= 50) ? "ผ่าน" : "ไม่ผ่าน";

            let output =
                "คะแนน: " + score + "<br>" +
                "เกรด: " + grade + "<br>" +
                "ผลสอบ: " + result + "<br>" +
                "คำอธิบาย: " + description;

            document.getElementById("outputBox").innerHTML = output;

            console.log("คะแนน:", score);
            console.log("เกรด:", grade);
            console.log("ผลสอบ:", result);
            console.log("คำอธิบาย:", description);
        }
    </script>

</body>
</html>
